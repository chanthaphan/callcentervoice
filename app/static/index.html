<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call Analysis</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d2430;
        --muted: #667085;
        --line: #d8dee8;
        --surface: #ffffff;
        --panel: #f5f7fb;
        --accent: #0f766e;
        --accent-soft: #d8f1ed;
        --agent: #2563eb;
        --customer: #0f766e;
        --warning: #b45309;
        --bad: #b42318;
        --good: #15803d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--panel);
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 720;
        letter-spacing: 0;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      input {
        width: min(42vw, 420px);
        min-width: 160px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
        background: #fff;
      }

      button {
        min-height: 36px;
        border: 1px solid #b8c2d3;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-weight: 650;
        padding: 0 12px;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      main {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 0;
      }

      aside {
        border-right: 1px solid var(--line);
        background: var(--surface);
        overflow: auto;
      }

      .call-row {
        width: 100%;
        display: grid;
        gap: 5px;
        padding: 12px 14px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        text-align: left;
        background: #fff;
      }

      .call-row.active { background: #eaf7f5; }

      .file-name {
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 700;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .status {
        font-weight: 750;
        text-transform: capitalize;
      }

      .status.failed { color: var(--bad); }
      .status.complete { color: var(--good); }
      .status.processing, .status.queued { color: var(--warning); }

      .detail {
        min-width: 0;
        overflow: auto;
        padding: 18px 22px 32px;
      }

      .empty {
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-weight: 650;
      }

      section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        letter-spacing: 0;
      }

      p { margin: 0; line-height: 1.45; }

      audio {
        width: 100%;
        display: block;
        margin-top: 10px;
      }

      .workspace {
        display: grid;
        gap: 16px;
      }

      .summary-band {
        display: grid;
        grid-template-columns: minmax(280px, 1.1fr) minmax(260px, 0.9fr);
        gap: 18px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .stage-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .stage-pill {
        border: 1px solid #c8d1df;
        border-radius: 999px;
        padding: 5px 9px;
        color: var(--muted);
        background: #fff;
        font-size: 12px;
        font-weight: 750;
        text-transform: capitalize;
      }

      .stage-pill.active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
      }

      .stage-pill.done {
        border-color: rgba(21, 128, 61, 0.35);
        color: var(--good);
      }

      .chip {
        border: 1px solid #c8d1df;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        background: #fff;
      }

      .sentiment-negative { color: var(--bad); }
      .sentiment-positive { color: var(--good); }
      .sentiment-mixed { color: var(--warning); }

      .chip.critical {
        border-color: rgba(180, 35, 24, 0.35);
        color: var(--bad);
        background: rgba(180, 35, 24, 0.07);
      }

      .chip.product {
        border-color: rgba(22, 101, 216, 0.32);
        color: var(--accent);
        background: var(--accent-soft);
      }

      .overlay-panel {
        display: grid;
        gap: 12px;
      }

      .overlay-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .tool-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .time-scale {
        position: relative;
        height: 22px;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .overlay-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 8px;
        scroll-behavior: smooth;
      }

      .timeline-canvas {
        min-width: 100%;
      }

      .tick {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
      }

      .rail {
        position: relative;
        min-height: 176px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(29,36,48,0.05) 1px, transparent 1px) 0 0 / 120px 100%,
          #fbfcfe;
        overflow: visible;
      }

      .track-label {
        position: absolute;
        left: 0;
        width: 74px;
        height: 26px;
        padding: 5px 8px;
        border-radius: 4px;
        background: rgba(255,255,255,0.92);
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        z-index: 3;
      }

      .track-customer { top: 22px; }
      .track-agent { top: 72px; }
      .track-flags { top: 124px; }

      .bar {
        position: absolute;
        height: 30px;
        border-radius: 6px;
        padding: 7px 9px;
        color: #fff;
        font-size: 12px;
        font-weight: 720;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.18);
      }

      .bar.customer { top: 18px; background: var(--customer); }
      .bar.staff { top: 68px; background: var(--agent); }
      .bar.unknown { top: 94px; background: #64748b; }
      .bar.negative { outline: 3px solid rgba(180, 35, 24, 0.22); }
      .bar.positive { outline: 3px solid rgba(21, 128, 61, 0.18); }
      .bar.mixed { outline: 3px solid rgba(180, 83, 9, 0.2); }

      .marker {
        position: absolute;
        top: 122px;
        width: 12px;
        height: 42px;
        transform: translateX(-50%);
        cursor: pointer;
      }

      .marker::before {
        content: "";
        display: block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--warning);
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px rgba(180, 83, 9, 0.6);
      }

      .marker span {
        position: absolute;
        top: 16px;
        left: 50%;
        width: 120px;
        transform: translateX(-50%);
        text-align: center;
        font-size: 11px;
        color: var(--warning);
        font-weight: 750;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .zoom-level {
        min-width: 56px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        text-align: center;
      }

      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #111827;
        z-index: 4;
        pointer-events: none;
      }

      .playhead::after {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #111827;
        transform: translateX(-50%);
      }

      .two-column {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(280px, 0.8fr);
        gap: 18px;
      }

      .timeline {
        display: grid;
        gap: 0;
      }

      .segment {
        display: grid;
        grid-template-columns: 82px 1fr;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }

      .segment:first-child { border-top: 0; }
      .segment.active { background: var(--accent-soft); margin: 0 -8px; padding: 10px 8px; border-radius: 6px; }

      .time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }

      .speaker {
        font-weight: 760;
        margin-bottom: 4px;
      }

      .lists {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      ul {
        margin: 0;
        padding-left: 18px;
        line-height: 1.45;
      }

      @media (max-width: 960px) {
        header { align-items: stretch; flex-direction: column; }
        .controls { flex-wrap: wrap; }
        input { width: 100%; }
        main { grid-template-columns: 1fr; grid-template-rows: 240px 1fr; }
        aside { border-right: 0; border-bottom: 1px solid var(--line); }
        .summary-band, .two-column, .lists { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Call Analysis</h1>
        <div class="controls">
          <input id="folder" value="voice" aria-label="Folder path" />
          <button class="primary" id="process">Process</button>
          <button id="refresh">Refresh</button>
        </div>
      </header>
      <main>
        <aside id="calls"></aside>
        <div class="detail" id="detail">
          <div class="empty">No calls loaded</div>
        </div>
      </main>
    </div>

    <script>
      const callsEl = document.querySelector("#calls");
      const detailEl = document.querySelector("#detail");
      const folderEl = document.querySelector("#folder");
      let calls = [];
      let selectedId = null;
      let currentTime = 0;
      let selectedRenderKey = null;
      let overlayZoom = 4;
      let activePlayerState = null;

      const fmtTime = (value) => {
        const seconds = Math.max(0, Math.floor(value || 0));
        const min = String(Math.floor(seconds / 60)).padStart(2, "0");
        const sec = String(seconds % 60).padStart(2, "0");
        return `${min}:${sec}`;
      };

      const escapeHtml = (value) =>
        String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[char]));

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const pct = (time, duration) => `${clamp((time / Math.max(duration || 1, 1)) * 100, 0, 100)}%`;

      async function loadCalls() {
        const res = await fetch("/api/calls");
        calls = await res.json();
        if (!selectedId && calls.length) selectedId = calls[0].id;
        renderCalls();
        renderDetail();
      }

      function renderCalls() {
        callsEl.innerHTML = calls.map((call) => `
          <button class="call-row ${call.id === selectedId ? "active" : ""}" data-id="${call.id}">
            <span class="file-name">${escapeHtml(call.file_name)}</span>
            <span class="meta">
              <span class="status ${call.status}">${escapeHtml(call.status)}</span>
              <span>${new Date(call.updated_at).toLocaleString()}</span>
            </span>
          </button>
        `).join("");
      }

      function renderDetail(force = false) {
        const call = calls.find((item) => item.id === selectedId);
        if (!call) {
          selectedRenderKey = null;
          detailEl.innerHTML = `<div class="empty">No calls loaded</div>`;
          return;
        }
        const existingPlayer = document.querySelector("#player");
        if (existingPlayer && selectedRenderKey?.startsWith(`${call.id}:`)) {
          activePlayerState = {
            time: existingPlayer.currentTime || currentTime,
            playing: !existingPlayer.paused && !existingPlayer.ended,
            rate: existingPlayer.playbackRate || 1,
          };
        }
        const renderKey = `${call.id}:${call.status}:${call.updated_at}`;
        if (
          !force &&
          activePlayerState?.playing &&
          call.status === "processing" &&
          renderKey !== selectedRenderKey
        ) {
          selectedRenderKey = renderKey;
          updateLiveStatus(call);
          return;
        }
        if (!force && renderKey === selectedRenderKey) return;
        selectedRenderKey = renderKey;
        currentTime = activePlayerState?.time || currentTime || 0;
        if (call.status === "failed") {
          detailEl.innerHTML = `
            <section>
              <h2>${escapeHtml(call.file_name)}</h2>
              ${renderStages(call.stage || "failed")}
              <p>${escapeHtml(call.error || "Processing failed")}</p>
            </section>
          `;
          return;
        }
        if (!call.transcript) {
          detailEl.innerHTML = `
            <section>
              <h2>${escapeHtml(call.file_name)}</h2>
              ${renderStages(call.stage || call.status)}
              <p>${escapeHtml(call.progress_message || call.status)}</p>
            </section>
          `;
          return;
        }
        const a = call.analysis || {
          summary: call.progress_message || "Analysis will appear here when processing finishes.",
          customer_sentiment: "neutral",
          agent_sentiment: "neutral",
          customer_tone_flags: [],
          agent_tone_flags: [],
          customer_emotion_journey: [],
          agent_emotion_journey: [],
          key_topics: [],
          critical_flags: [],
          credit_card_products: [],
          risks: [],
          next_actions: [],
        };
        const t = call.transcript;
        const duration = t.duration_seconds || Math.max(...t.segments.map((seg) => seg.end || 0), 1);
        detailEl.innerHTML = `
          <div class="workspace">
            <div class="summary-band">
              <section>
                <h2>${escapeHtml(call.file_name)}</h2>
                ${renderStages(call.stage || call.status)}
                <p>${escapeHtml(a.summary)}</p>
                <div class="tool-row">
                  <button onclick="window.location.href='/api/calls/${call.id}/download.txt'">Download TXT</button>
                </div>
                <audio id="player" controls preload="metadata" src="/api/calls/${call.id}/audio"></audio>
              </section>
              <section>
                <h2>Flags</h2>
                <div class="chips">
                  <span class="chip sentiment-${a.customer_sentiment}">Customer ${escapeHtml(a.customer_sentiment)}</span>
                  <span class="chip sentiment-${a.agent_sentiment}">Agent ${escapeHtml(a.agent_sentiment)}</span>
                  ${a.customer_tone_flags.concat(a.agent_tone_flags).map((flag) => `<span class="chip">${escapeHtml(flag)}</span>`).join("")}
                  ${(a.critical_flags || []).map((flag) => `<span class="chip critical">${escapeHtml(flag)}</span>`).join("")}
                  ${(a.credit_card_products || []).map((product) => `<span class="chip product">${escapeHtml(product)}</span>`).join("")}
                </div>
              </section>
            </div>

            <section class="overlay-panel">
              <div class="overlay-head">
                <h2>Audio Overlay</h2>
                <div class="tool-row">
                  <button id="zoomOut">Zoom Out</button>
                  <span class="zoom-level">${Math.round(overlayZoom * 25)}%</span>
                  <button id="zoomIn">Zoom In</button>
                </div>
              </div>
              <div class="overlay-scroll" id="overlayScroll">
                <div class="timeline-canvas" style="width: ${timelineWidth(duration)}px">
                  <div class="time-scale">${renderTicks(duration)}</div>
                  <div class="rail" id="overlay">
                    <div class="track-label track-customer">Customer</div>
                    <div class="track-label track-agent">Staff</div>
                    <div class="track-label track-flags">Flags</div>
                    ${renderBars(t.segments, duration)}
                    ${renderMarkers(a.customer_emotion_journey.concat(a.agent_emotion_journey), duration)}
                    <div class="playhead" id="playhead" style="left: 0%"></div>
                  </div>
                </div>
              </div>
            </section>

            <div class="two-column">
              <section>
                <h2>Transcript</h2>
                <div class="timeline">
                  ${t.segments.map((seg, index) => `
                    <div class="segment" data-time="${seg.start}" data-index="${index}">
                      <div class="time">${fmtTime(seg.start)}-${fmtTime(seg.end)}</div>
                      <div>
                        <div class="speaker">${escapeHtml(seg.speaker)} <span class="sentiment-${seg.sentiment}">${escapeHtml(seg.sentiment)}</span></div>
                        <p>${escapeHtml(seg.text)}</p>
                        <div class="chips">${(seg.keywords || []).concat(seg.tone_flags || []).map((tag) => `<span class="chip">${escapeHtml(tag)}</span>`).join("")}</div>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </section>
              <section>
                <h2>Journey</h2>
                <div class="timeline">
                  ${a.customer_emotion_journey.concat(a.agent_emotion_journey).sort((x, y) => x.time_seconds - y.time_seconds).map((moment) => `
                    <div class="segment" data-time="${moment.time_seconds}">
                      <div class="time">${fmtTime(moment.time_seconds)}</div>
                      <div>
                        <div class="speaker">${escapeHtml(moment.label)} <span class="sentiment-${moment.sentiment}">${escapeHtml(moment.sentiment)}</span></div>
                        <p>${escapeHtml(moment.description)}</p>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </section>
            </div>

            <div class="lists">
              ${renderList("Topics", a.key_topics)}
              ${renderList("Critical Flags", a.critical_flags)}
              ${renderList("Card Products", a.credit_card_products)}
              ${renderList("Risks", a.risks)}
              ${renderList("Next", a.next_actions)}
            </div>
          </div>
        `;
        wirePlayback(duration, activePlayerState);
      }

      function updateLiveStatus(call) {
        const stageStrip = detailEl.querySelector(".stage-strip");
        const firstSection = detailEl.querySelector(".summary-band section, section");
        if (stageStrip) stageStrip.outerHTML = renderStages(call.stage || call.status);
        if (firstSection) {
          const summary = firstSection.querySelector("p");
          if (summary && !call.analysis) summary.textContent = call.progress_message || call.status;
        }
      }

      function renderTicks(duration) {
        const minutes = Math.max(1, Math.ceil(duration / 60));
        const tickCount = Math.min(16, Math.max(5, minutes + 1));
        return Array.from({ length: tickCount }, (_, index) => index / (tickCount - 1)).map((ratio) => `
          <span class="tick" style="left: ${ratio * 100}%">${fmtTime(duration * ratio)}</span>
        `).join("");
      }

      function renderStages(currentStage) {
        const stages = ["queued", "transcribing", "diarizing", "analyzing", "complete"];
        const currentIndex = stages.indexOf(currentStage);
        return `
          <div class="stage-strip">
            ${stages.map((stage, index) => {
              const state = currentStage === "failed" ? "" : index < currentIndex ? "done" : index === currentIndex ? "active" : "";
              return `<span class="stage-pill ${state}">${escapeHtml(stage)}</span>`;
            }).join("")}
          </div>
        `;
      }

      function timelineWidth(duration) {
        return Math.max(900, Math.ceil((duration || 1) * overlayZoom));
      }

      function renderBars(segments, duration) {
        return segments.map((seg, index) => {
          const roleClass = roleForSpeaker(seg.speaker);
          const width = clamp(((seg.end - seg.start) / Math.max(duration, 1)) * 100, 1.5, 100);
          const title = [seg.speaker, seg.sentiment].concat(seg.tone_flags || [], seg.keywords || []).filter(Boolean).join(" | ");
          return `
            <button
              class="bar ${roleClass} ${seg.sentiment}"
              data-time="${seg.start}"
              data-index="${index}"
              title="${escapeHtml(title)}"
              style="left: ${pct(seg.start, duration)}; width: ${width}%"
            >
              ${escapeHtml((seg.keywords && seg.keywords[0]) || seg.sentiment || seg.speaker)}
            </button>
          `;
        }).join("");
      }

      function roleForSpeaker(speaker) {
        const value = String(speaker || "").toLowerCase();
        if (value.includes("customer") || value.includes("ลูกค้า")) return "customer";
        if (
          value.includes("staff") ||
          value.includes("agent") ||
          value.includes("call center") ||
          value.includes("เจ้าหน้าที่") ||
          value.includes("พนักงาน")
        ) return "staff";
        return "unknown";
      }

      function renderMarkers(moments, duration) {
        return moments.map((moment) => `
          <button class="marker" data-time="${moment.time_seconds}" title="${escapeHtml(moment.description)}" style="left: ${pct(moment.time_seconds, duration)}">
            <span>${escapeHtml(moment.label)}</span>
          </button>
        `).join("");
      }

      function renderList(title, items) {
        return `<section><h2>${title}</h2><ul>${(items || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></section>`;
      }

      function wirePlayback(duration, restoreState = null) {
        const player = document.querySelector("#player");
        const playhead = document.querySelector("#playhead");
        const overlay = document.querySelector("#overlay");
        const overlayScroll = document.querySelector("#overlayScroll");
        if (!player || !playhead || !overlay || !overlayScroll) return;

        const requestPlay = () => {
          const promise = player.play();
          if (promise) promise.catch(() => {});
        };

        const seekTo = (time, event) => {
          if (event) {
            event.preventDefault();
            event.stopPropagation();
          }
          const targetTime = clamp(Number(time) || 0, 0, duration);
          const playAfterSeek = player.paused || !player.ended;

          if (player.readyState === 0) {
            player.addEventListener("loadedmetadata", () => seekTo(targetTime), { once: true });
            player.load();
            return;
          }

          player.currentTime = targetTime;
          sync();
          if (playAfterSeek) {
            requestPlay();
            player.addEventListener("seeked", requestPlay, { once: true });
          }
        };

        const sync = () => {
          currentTime = player.currentTime || 0;
          playhead.style.left = pct(currentTime, duration);
          const playheadX = (currentTime / Math.max(duration || 1, 1)) * overlay.clientWidth;
          const viewStart = overlayScroll.scrollLeft;
          const viewEnd = viewStart + overlayScroll.clientWidth;
          if (!player.paused && (playheadX < viewStart + 40 || playheadX > viewEnd - 40)) {
            overlayScroll.scrollLeft = Math.max(0, playheadX - overlayScroll.clientWidth / 2);
          }
          document.querySelectorAll(".segment").forEach((row) => {
            const start = Number(row.dataset.time || 0);
            const next = row.nextElementSibling ? Number(row.nextElementSibling.dataset.time || duration) : duration;
            row.classList.toggle("active", currentTime >= start && currentTime < next);
          });
        };

        player.addEventListener("timeupdate", sync);
        player.addEventListener("seeked", sync);
        player.addEventListener("play", () => {
          activePlayerState = { time: player.currentTime || 0, playing: true, rate: player.playbackRate || 1 };
        });
        player.addEventListener("pause", () => {
          activePlayerState = { time: player.currentTime || 0, playing: false, rate: player.playbackRate || 1 };
        });
        document.querySelector("#zoomIn")?.addEventListener("click", () => {
          overlayZoom = clamp(overlayZoom * 1.5, 2, 24);
          selectedRenderKey = null;
          renderDetail(true);
        });
        document.querySelector("#zoomOut")?.addEventListener("click", () => {
          overlayZoom = clamp(overlayZoom / 1.5, 2, 24);
          selectedRenderKey = null;
          renderDetail(true);
        });
        detailEl.querySelectorAll("[data-time]").forEach((item) => {
          item.addEventListener("click", (event) => seekTo(item.dataset.time, event));
        });
        overlay.addEventListener("click", (event) => {
          if (event.target.closest("[data-time]")) return;
          const rect = overlay.getBoundingClientRect();
          const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
          seekTo(duration * ratio, event);
        });
        if (restoreState?.time) {
          player.currentTime = clamp(restoreState.time, 0, duration);
        }
        if (restoreState?.rate) {
          player.playbackRate = restoreState.rate;
        }
        if (restoreState?.playing) {
          requestPlay();
        }
        sync();
      }

      callsEl.addEventListener("click", (event) => {
        const row = event.target.closest(".call-row");
        if (!row) return;
        selectedId = row.dataset.id;
        selectedRenderKey = null;
        renderCalls();
        renderDetail(true);
      });

      document.querySelector("#process").addEventListener("click", async () => {
        await fetch("/api/process-folder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ folder: folderEl.value || "voice" }),
        });
        await loadCalls();
      });

      document.querySelector("#refresh").addEventListener("click", loadCalls);
      loadCalls();
      setInterval(loadCalls, 5000);
    </script>
  </body>
</html>
